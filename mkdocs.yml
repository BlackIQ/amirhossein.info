INHERIT: ./mkdocs.env.yml

site_name: Amirhossein Mohammadi
site_description: Personal website, notes, projects, and writings by Amirhossein Mohammadi.
site_author: Amirhossein Mohammadi
site_url: https://amirhossein.info

copyright: Copyright &copy; 2026 Amirhossein Mohammadi

repo_name: BlackIQ/amirhossein.info
repo_url: https://github.com/BlackIQ/amirhossein.info

theme:
  name: material
  variant: modern
  language: en

  font:
    text: Inter
    code: JetBrains Mono

  # palette:
  #   - media: "(prefers-color-scheme)"
  #     toggle:
  #       icon: material/brightness-auto
  #       name: Switch to light mode

  #   - media: "(prefers-color-scheme: light)"
  #     scheme: default
  #     primary: custom
  #     accent: custom
  #     toggle:
  #       icon: material/brightness-7
  #       name: Switch to dark mode

  #   - media: "(prefers-color-scheme: dark)"
  #     scheme: slate
  #     primary: custom
  #     accent: custom
  #     toggle:
  #       icon: material/brightness-4
  #       name: Switch to system preference

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference

  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - navigation.tabs
    - content.tabs.link
    - navigation.tabs.sticky
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  icon:
    repo: octicons/mark-github-24

  # logo: img/favicon.png
  # favicon: img/favicon.png

nav:
  - Home: index.md
  - "":
    - Experience: experience/index.md
  - "":
    - Open Source: open-source/index.md
    - I live in terminal!: open-source/terminal.md
    - Packages:
      - NPM: open-source/packages/npm.md
      - PyPI: open-source/packages/pypi.md
      - Docker Images: open-source/packages/images.md
    - Projects:
      - Hello World: open-source/projects/hello-world.md
      - TGJU API: open-source/projects/tgju-api.md
      - Rachel: open-source/projects/rachel.md
    - Platforms:
      - OpenHubble: projects/platforms/openhubble.md
      - TFASoft: projects/platforms/tfasoft.md
    - Products:
      - Coffee Roaster: projects/products/coffee-roaster.md
      - PGPoolAdmin: projects/products/pgpooladmin.md
      - Since: projects/products/since.md
      - VUI: projects/products/vui.md

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/BlackIQ

    - icon: fontawesome/brands/github
      link: https://github.com/BlackIQ

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/amirhosseinmohammadi/

    - icon: fontawesome/solid/envelope
      link: mailto:hi@amirhossein.info

validation:
  unresolved_references: false