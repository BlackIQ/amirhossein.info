INHERIT: ./mkdocs.env.yml

site_name: Amirhossein Mohammadi
site_description: Personal website, notes, projects, and writings by Amirhossein Mohammadi.
site_author: Amirhossein Mohammadi
site_url: https://amirhossein.info

copyright: Copyright &copy; 2026 Amirhossein Mohammadi

repo_name: BlackIQ/amirhossein.info
repo_url: https://github.com/BlackIQ/amirhossein.info

theme:
  name: material
  variant: modern
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono

  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - navigation.tabs
    - content.tabs.link
    - navigation.tabs.sticky
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

  icon:
    repo: octicons/mark-github-24

  logo: https://github.com/BlackIQ.png
  favicon: https://github.com/BlackIQ.png

nav:
  - Home: index.md
  - "":
    - Experience: experience/index.md
  - "":
    - Open Source: open-source/index.md
    - Terminal: open-source/terminal.md
    - Packages:
      - Packages Overview: open-source/packages/index.md
      - NPM: open-source/packages/npm.md
      - PyPI: open-source/packages/pypi.md
      - Docker Images: open-source/packages/images.md
    - Platforms:
      - Platforms Overview: open-source/platforms/index.md
      - OpenHubble: open-source/platforms/openhubble.md
      - TFASoft: open-source/platforms/tfasoft.md
    - Products:
      - Products Overview: open-source/products/index.md
      - Coffee Roaster: open-source/products/coffee-roaster.md
      - pgPoolAdmin: open-source/products/pgpooladmin.md
      - Since: open-source/products/since.md
      - VUI: open-source/products/vui.md
    - Projects:
      - Projects Overview: open-source/projects/index.md
      - Hello World: open-source/projects/hello-world.md
      - TGJU API: open-source/projects/tgju-api.md
      - Rachel: open-source/projects/rachel.md
  - "":
    - Ventures: ventures/index.md
  - Blog:
    - blog/index.md


extra:
  analytics:
    provider: google
    property: G-2YJP7776K6
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/BlackIQ
    - icon: fontawesome/brands/github
      link: https://github.com/BlackIQ
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/amirhosseinmohammadi/
    - icon: fontawesome/solid/envelope
      link: mailto:hi@amirhossein.info

plugins:
  - search
  - blog

validation:
  unresolved_references: false